{% set name = "tb3py" %}
{% set version = "2026.11.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tb3py-{{ version }}.tar.gz
  sha256: 49ad4af27d51c9a3a93a556a16c0727ac8eb225d474ae5682516f87f35875426

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
    - requests >=2.26.0
  run:
    - jarvis-tools
    - julia >=0.5.6
    - numpy >=1.19.5
    - pytest
    - python >=3.6
    - requests >=2.26.0

test:
  imports:
    - tb3py
    - tb3py.tests


about:
  home: https://github.com/usnistgov/tb3py
  summary: 'tb3: an open-source software package for accurate and efficient electronic structure calculations using tight-binding (TB), including three-body interactions. https://pages.nist.gov/ThreeBodyTB.jl'
  license: NIST-PD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - knc6
